name: Telegram bot

on:
  schedule:
    # Кожні 15 хв (час UTC). Для приватного репозиторію постав "*/30 * * * *",
    # інакше не вистачить безкоштовних 2000 хв на місяць
    - cron: "*/15 * * * *"
  workflow_dispatch: # кнопка ручного запуску у вкладці Actions

permissions:
  contents: write # щоб зберігати state.json у репозиторій

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Оновлено стан бота"
            git pull --rebase --quiet
            git push
          fi
