name: Telegram bot

on:
  # Автоматичний запуск вимкнено: голосування завершилось.
  # Щоб увімкнути знову, поверни розклад:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: # лише ручний запуск у вкладці Actions

permissions:
  contents: write # щоб зберігати state.json у репозиторій

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Завжди свіжий main зі state.json, навіть при Re-run старого запуску
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Ручний запуск (Run workflow / Re-run) публікує пост завжди
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' }}
        run: python bot.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Оновлено стан бота"
            git pull --rebase --quiet
            git push
          fi
